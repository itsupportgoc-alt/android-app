[package]
name = "wordcraft-ffi"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "JNI bridge between the Android app and the WordCraft document engine (unmodified upstream crates)"

[lib]
name = "wordcraft_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
wordcraft-doc = { path = "../../wordcraft/crates/doc" }
wordcraft-docx = { path = "../../wordcraft/crates/docx" }
wordcraft-engine = { path = "../../wordcraft/crates/engine" }
serde_json = "1"
jni = "0.21"
base64 = "0.22"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
debug = false
